<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iintoo</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>

<body>
    <main>
        <div class="picture">
            <img src="./images/bg.jpg" alt="background illustration for iintoo invest together">
        </div>

<form class="content">
     <header>
        <img src="./images/logo.svg" alt="iintoo logo">
        <h1>Get iintoo it today</h1>
        <p>There is no charge or obligation upon registration.</p>
    </header>
        <div>
            <button class="facebook" type="button">Register with facebook</button>
            <img src="./images/facebook.svg" alt="facebook logo">
        </div>

        <div>
            <button class="linkedin" type="button">Register with LinkedIn</button>
            <img src="./images/linkedin.svg" alt="linked logo">
        </div>

        <br>
        <p>or</p>
        <br>

     <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="Email" placeholder="enter your email">

        <label for="tel">Phone</label>
        <input type="tel" id="tel" name="tel" placeholder="enter your phone number">
    </div>
</form>
        <h4>What type of investor are you?</h4>
        <p>Select the type of investor you are below.</p>
        <br><br>

    <div>
        <label class="radio-option">
        <input type="radio" name="type of investor" value="individual">
        Individual
        <p class="hover">I am a natural person investing on my own behalf as a sole owner, joint tenant, or tenant in common</p>
        </label>
        
        <label>
        <input type="radio" name="type of investor" value="business">
        Business
        </label>

        <label>
        <input type="radio" name="type of investor" value="IRA">
        IRA
        </label>

        <label>
        <input type="radio" name="type of investor" value="trust">
        Trust
        </label>
    </div>
    </main>

        <br><br>

    <footer>
        <div>
        <input type="checkbox">
        I agree to the terms and receiving notifications from iintoo View full terms
        </div>

        <p>
            <button class="create-button" type="submit">Create Account</button>
        </p>
    </footer>

</body>
</html>
