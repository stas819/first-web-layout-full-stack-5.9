<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iintoo</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<!-- до этого момента все отлично -->


<body>
    <main>
        <div class="container">

        <div class="left">
            <img class="bg" src="./images/bg.jpg" alt="background illustration for iintoo invest together">
            <img class="logo" src="./images/logo.svg" alt="iintoo logo">
        </div>
<!-- до этого момента тут все что должно находиться слева -->

        <div class="right">
        <header>
        <h1>Get iintoo it today</h1>
        <p>There is no charge or obligation upon registration.</p>
        </header>
<!-- блок с header -->

        <div class="media">
        <button class="facebook">
            <div type="button">Register with facebook</div>
            <img class="fb-logo" src="./images/facebook.svg" alt="facebook logo">
        </button>

        <button class="linkedin">
            <div type="button">Register with LinkedIn</div>
            <img class="in-logo" src="./images/linkedin.svg" alt="linked logo">
        </button>
        </div>
<!-- блок с кнопками регистрации -->

        <br>
        <p class="or"><span>────────</span> or <span>────────</span></p>
        <br>

        <div class="registration">
        <label for="email">Email</label>
        <input type="email" id="email" name="Email" placeholder="enter your email">

        <label for="tel">Phone</label>
        <input type="tel" id="tel" name="tel" placeholder="enter your phone number">
        </div>
<!-- блок с имейлом и номером -->

        <br><br>

        <div>
        <p class="investor">What type of investor are you?</p>
        <p class="content">Select the type of investor you are below.</p>
        </div>

        <br><br>
<!--  -->

        <div class="types">
                <label class="radio">
                <input type="radio" name="type of investor" value="individual">
                 Individual
                         <span class="info">
                        ⓘ
                                <span class="pop-up_content">I am a natural person investing on my own behalf as a sole owner.</span>
                        </span>
                 </label>
        
        <label>
        <input type="radio" name="type of investor" value="business">
        Business
                         <span class="info">
                        ⓘ
                                <span class="pop-up_content">I'm a CEO of my company.</span>
                        </span>
        </label>

        <label>
        <input type="radio" name="type of investor" value="IRA">
        IRA
                         <span class="info">
                        ⓘ
                                <span class="pop-up_content">Individual Retirement Account</span>
                        </span>
        </label>

        <label>
        <input type="radio" name="type of investor" value="trust">
        Trust
                        <span class="info">
                        ⓘ
                                <span class="pop-up_content">Trust Insurance</span>
                        </span>
        </label>
        </div>
<!-- тут наверху 4 types of invester -->

        <br><br>

        <div class="terms">
        <input type="checkbox">
        I agree to the terms and receiving notifications from iintoo <a href="https://google.com">View full terms</a>
        </div>
<!--  -->

        <br><br>
<!--  -->

        <button class="create-ac">
            <div type="button">Create account</div>
        </button>
        
<!-- конец -->
        </div>
    </main>
</body>
</html>
